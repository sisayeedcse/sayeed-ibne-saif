<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0A0D12"/>
  
  <!-- Blue accent border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Left bracket < -->
  <polyline points="9,10 5,16 9,22" fill="none" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right bracket > -->
  <polyline points="23,10 27,16 23,22" fill="none" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Slash / -->
  <line x1="19" y1="9" x2="13" y2="23" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
